services:
  bilibili-downloader-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaocaoooo/bilibili-downloader-server:latest
    container_name: bilibili-downloader-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - BILIBILI_COOKIE=${BILIBILI_COOKIE:?BILIBILI_COOKIE environment variable must be set}
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bilibili-network

networks:
  bilibili-network:
    driver: bridge
